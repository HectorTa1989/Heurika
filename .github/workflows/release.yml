name: Release to App Store Connect

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version (for example, 1.0.1)
        required: true
        default: 1.0.0
        type: string
      submit_for_review:
        description: Submit the uploaded version for App Review after upload
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: appstore-release
  cancel-in-progress: false

jobs:
  archive-and-upload:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.heurika.app
      KEYBOARD_BUNDLE_ID: com.heurika.app.keyboard
      APP_PROFILE_NAME: ${{ secrets.HEURIKA_APP_PROFILE_NAME }}
      KEYBOARD_PROFILE_NAME: ${{ secrets.HEURIKA_KEYBOARD_PROFILE_NAME }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      REVENUECAT_API_KEY: ${{ secrets.HEURIKA_REVENUECAT_API_KEY }}
      PRIVACY_POLICY_URL: ${{ secrets.HEURIKA_PRIVACY_POLICY_URL }}
      TERMS_OF_USE_URL: ${{ secrets.HEURIKA_TERMS_OF_USE_URL }}
      SUPPORT_URL: ${{ secrets.HEURIKA_SUPPORT_URL }}

    steps:
      - name: Check out the pushed source
        uses: actions/checkout@v4

      - name: Validate required release secrets
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          CERT_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.HEURIKA_APP_PROFILE_BASE64 }}
          KEYBOARD_PROFILE_BASE64: ${{ secrets.HEURIKA_KEYBOARD_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            APPLE_TEAM_ID APP_PROFILE_NAME KEYBOARD_PROFILE_NAME
            REVENUECAT_API_KEY PRIVACY_POLICY_URL TERMS_OF_USE_URL SUPPORT_URL
            ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64 CERT_BASE64 CERT_PASSWORD
            APP_PROFILE_BASE64 KEYBOARD_PROFILE_BASE64
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret/environment value: ${name}" >&2
              exit 1
            fi
          done

      - name: Select Xcode with an installed iPhoneOS SDK
        run: |
          set -euo pipefail
          selected=""
          while IFS= read -r candidate; do
            if compgen -G "$candidate/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS*.sdk" > /dev/null; then
              selected="$candidate"
              break
            fi
          done < <(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -Vr)
          if [[ -z "$selected" ]]; then
            echo "No Xcode with an installed iPhoneOS SDK found" >&2
            xcodebuild -showsdks || true
            exit 1
          fi
          sudo xcode-select -s "$selected"
          export DEVELOPER_DIR="$selected/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iOS|iphoneos'

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Install signing certificate and profiles
        env:
          CERT_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.HEURIKA_APP_PROFILE_BASE64 }}
          KEYBOARD_PROFILE_BASE64: ${{ secrets.HEURIKA_KEYBOARD_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain_path="${RUNNER_TEMP}/heurika-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "KEYCHAIN_PATH=${keychain_path}" >> "${GITHUB_ENV}"
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security default-keychain -s "${keychain_path}"

          cert_path="${RUNNER_TEMP}/distribution.p12"
          echo "${CERT_BASE64}" | base64 --decode > "${cert_path}"
          security import "${cert_path}" -k "${keychain_path}" -P "${CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain_path}"

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          echo "${APP_PROFILE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/heurika.mobileprovision"
          echo "${KEYBOARD_PROFILE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/heurika-keyboard.mobileprovision"
          cp "${RUNNER_TEMP}/heurika.mobileprovision" "${HOME}/Library/MobileDevice/Provisioning Profiles/"
          cp "${RUNNER_TEMP}/heurika-keyboard.mobileprovision" "${HOME}/Library/MobileDevice/Provisioning Profiles/"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Verify app and keyboard Info.plist files
        run: |
          set -euo pipefail
          plutil -lint Heurika/Resources/Info.plist HeurikaKeyboard/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' Heurika/Resources/Info.plist >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations:0' Heurika/Resources/Info.plist >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' HeurikaKeyboard/Info.plist | grep -Fx 'com.apple.keyboard-service'

      - name: Verify release signing settings
        run: |
          set -euo pipefail
          for target in Heurika HeurikaKeyboard; do
            xcodebuild -showBuildSettings \
              -project Heurika.xcodeproj \
              -target "$target" \
              -configuration Release \
              -sdk iphoneos \
              DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
              APPLE_TEAM_ID="${APPLE_TEAM_ID}" \
              HEURIKA_APP_PROFILE_NAME="${APP_PROFILE_NAME}" \
              HEURIKA_KEYBOARD_PROFILE_NAME="${KEYBOARD_PROFILE_NAME}" \
              | grep -E 'CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER' || true
          done

      - name: Archive the app and keyboard extension
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive \
            -project Heurika.xcodeproj \
            -scheme Heurika \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "${PWD}/build/Heurika.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            APPLE_TEAM_ID="${APPLE_TEAM_ID}" \
            HEURIKA_APP_PROFILE_NAME="${APP_PROFILE_NAME}" \
            HEURIKA_KEYBOARD_PROFILE_NAME="${KEYBOARD_PROFILE_NAME}" \
            MARKETING_VERSION='${{ inputs.version }}' \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            HEURIKA_REVENUECAT_API_KEY="${REVENUECAT_API_KEY}" \
            HEURIKA_PRIVACY_POLICY_URL="${PRIVACY_POLICY_URL}" \
            HEURIKA_TERMS_OF_USE_URL="${TERMS_OF_USE_URL}" \
            HEURIKA_SUPPORT_URL="${SUPPORT_URL}" \
            | tee build/archive.log

      - name: Export the IPA
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>${APP_BUNDLE_ID}</key><string>${APP_PROFILE_NAME}</string>
              <key>${KEYBOARD_BUNDLE_ID}</key><string>${KEYBOARD_PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "${PWD}/build/Heurika.xcarchive" \
            -exportPath "${PWD}/build/export" \
            -exportOptionsPlist "${PWD}/build/ExportOptions.plist"

      - name: Verify exported IPA metadata
        run: |
          set -euo pipefail
          ipa_path="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          [[ -n "${ipa_path}" ]] || { echo 'IPA was not exported' >&2; exit 1; }
          unzip -p "${ipa_path}" Payload/Heurika.app/Info.plist > "${RUNNER_TEMP}/heurika-app-info.plist"
          unzip -p "${ipa_path}" Payload/Heurika.app/PlugIns/HeurikaKeyboard.appex/Info.plist > "${RUNNER_TEMP}/heurika-keyboard-info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "${RUNNER_TEMP}/heurika-app-info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations:0' "${RUNNER_TEMP}/heurika-app-info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "${RUNNER_TEMP}/heurika-keyboard-info.plist" | grep -Fx 'com.apple.keyboard-service'

      - name: Upload the IPA to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/appstoreconnect-api-key.p8"
          echo "${ASC_KEY_BASE64}" | base64 --decode > "${key_path}"
          mkdir -p "${RUNNER_TEMP}/fastlane"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          payload = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": (temp / "appstoreconnect-api-key.p8").read_text(),
              "in_house": False,
          }
          (temp / "fastlane" / "api_key.json").write_text(json.dumps(payload))
          PY
          sudo gem install fastlane --no-document
          ipa_path="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          [[ -n "${ipa_path}" ]] || { echo 'IPA was not exported' >&2; exit 1; }
          fastlane pilot upload \
            --ipa "${ipa_path}" \
            --api_key_path "${RUNNER_TEMP}/fastlane/api_key.json" \
            --skip_waiting_for_build_processing true

      - name: Submit the uploaded build for App Review
        if: ${{ inputs.submit_for_review == true }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/appstoreconnect-api-key.p8"
          echo "${ASC_KEY_BASE64}" | base64 --decode > "${key_path}"
          mkdir -p "${RUNNER_TEMP}/fastlane"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          payload = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": (temp / "appstoreconnect-api-key.p8").read_text(),
              "in_house": False,
          }
          (temp / "fastlane" / "api_key.json").write_text(json.dumps(payload))
          PY
          sudo gem install fastlane --no-document
          fastlane deliver \
            --submit_for_review true \
            --api_key_path "${RUNNER_TEMP}/fastlane/api_key.json" \
            --skip_metadata true \
            --skip_screenshots true \
            --force

      - name: Upload archive artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heurika-release-${{ github.run_number }}
          path: |
            build/archive.log
            build/export/*.ipa
            build/Heurika.xcarchive/dSYMs/**/*.dSYM
          if-no-files-found: warn
